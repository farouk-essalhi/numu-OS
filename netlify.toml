# Netlify builds the app itself; the Next.js runtime (@netlify/plugin-nextjs)
# is added automatically and turns server features into Netlify Functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly so it always runs (not version-pinned; Netlify keeps it current).
[[plugins]]
  package = "@netlify/plugin-nextjs"
